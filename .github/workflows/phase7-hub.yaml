name: Phase 7 - Hub Terraform

on:
  push:
    branches:
      - main
    paths:
      - "terraform/phase7/**"
      - "terraform/modules/**"
      - ".github/workflows/phase7-hub.yaml"

  workflow_dispatch:

# Required for GitHub OIDC
permissions:
  id-token: write
  contents: read

jobs:
  hub:
    name: Phase 7 - Hub
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configure AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::878962827886:role/Rajesh-devops
          aws-region: ap-south-1

      # 3. Verify AWS account
      - name: Verify AWS identity
        run: |
          echo "Checking AWS identity..."
          aws sts get-caller-identity

      
      # 5. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 6. Terraform Init
      - name: Terraform Init
        working-directory: terraform/phase7
        run: terraform init

      # 7. Terraform Format Check
      - name: Terraform Format Check
        working-directory: terraform/phase7
        run: terraform fmt 

      # 8. Terraform Validate
      - name: Terraform Validate
        working-directory: terraform/phase7
        run: terraform validate

      # 9. Terraform Plan
      - name: Terraform Plan
        working-directory: terraform/phase7
        run: terraform plan -out=tfplan

      # 10. Terraform Apply
      - name: Terraform Apply
        working-directory: terraform/phase7
        run: terraform apply -auto-approve tfplan    