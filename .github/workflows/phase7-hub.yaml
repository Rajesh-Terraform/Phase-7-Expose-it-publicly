
name: Phase 7 - Hub Public ALB

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "terraform/phase7-hub/**"
      - "terraform/modules/phase7-public-alb/**"
      - ".github/workflows/phase7-hub.yaml"

permissions:
  id-token: write
  contents: read

jobs:
  phase7-hub:
    name: Phase 7 - Hub Public ALB
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------
      # 1. Checkout Repository
      # ---------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------
      # 2. Configure Hub AWS Credentials using OIDC
      # ---------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.HUB_ROLE_ARN }}
          aws-region: ap-south-1

      # ---------------------------------------------
      # 3. Verify AWS Identity
      # ---------------------------------------------
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ---------------------------------------------
      # 4. Verify AWS Region
      # ---------------------------------------------
      - name: Verify AWS Region
        run: |
          aws configure get region

      # ---------------------------------------------
      # 5. Setup Terraform
      # ---------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ---------------------------------------------
      # 6. Terraform Version
      # ---------------------------------------------
      - name: Terraform Version
        run: |
          terraform version

      # ---------------------------------------------
      # 7. Terraform Format Check
      # ---------------------------------------------
      - name: Terraform Format Check
        working-directory: terraform/phase7-hub
        run: |
          terraform fmt -check -recursive

      # ---------------------------------------------
      # 8. Terraform Init
      # ---------------------------------------------
      - name: Terraform Init
        working-directory: terraform/phase7-hub
        run: |
          terraform init -input=false

      # ---------------------------------------------
      # 9. Terraform Validate
      # ---------------------------------------------
      - name: Terraform Validate
        working-directory: terraform/phase7-hub
        run: |
          terraform validate

      # ---------------------------------------------
      # 10. Terraform Plan
      # ---------------------------------------------
      - name: Terraform Plan
        working-directory: terraform/phase7-hub
        run: |
          terraform plan \
            -input=false \
            -out=tfplan \
            -var="aws_region=ap-south-1" \
            -var="hub_vpc_id=${{ vars.HUB_VPC_ID }}" \
            -var='hub_public_subnet_ids=["${{ vars.HUB_PUBLIC_SUBNET_1 }}","${{ vars.HUB_PUBLIC_SUBNET_2 }}"]' \
            -var='hub_private_subnet_ids=["${{ vars.HUB_PRIVATE_SUBNET_1 }}","${{ vars.HUB_PRIVATE_SUBNET_2 }}"]' \
            -var="spoke_state_bucket=${{ vars.SPOKE_STATE_BUCKET }}" \
            -var="spoke_state_key=phase7/spoke/terraform.tfstate" \
            -var="app_port=80"

      # ---------------------------------------------
      # 11. Terraform Apply
      # ---------------------------------------------
      - name: Terraform Apply
        working-directory: terraform/phase7-hub
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      # ---------------------------------------------
      # 12. Show Terraform Outputs
      # ---------------------------------------------
      - name: Terraform Outputs
        working-directory: terraform/phase7-hub
        run: |
          terraform output

      # ---------------------------------------------
      # 13. Show Public ALB DNS
      # ---------------------------------------------
      - name: Show ALB URL
        working-directory: terraform/phase7-hub
        run: |
          echo "========================================"
          echo "Phase 7 Public ALB"
          echo "========================================"

          ALB_DNS=$(terraform output -raw alb_dns_name)

          echo "ALB DNS:"
          echo "$ALB_DNS"

          echo ""
          echo "Application URL:"
          echo "http://$ALB_DNS 
