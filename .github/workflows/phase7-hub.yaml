name: Phase 7 - Hub Terraform

on:
  push:
    branches:
      - main
    paths:
      - "terraform/phase7-hub/**"
      - "terraform/modules/**"
      - ".github/workflows/phase7-hub.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  hub:
    name: Phase 7 - Hub
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::878962827886:role/Rajesh-devops
          aws-region: ap-south-1

      # 3. Verify AWS account
      - name: Verify AWS identity
        run: |
          echo "AWS Account:"
          aws sts get-caller-identity

     
      # 5. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 6. Show repository structure
      # This helps confirm the correct Terraform directory.
      - name: Show repository structure
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository:"
          ls -la

          echo ""
          echo "Terraform directories:"
          find ./terraform -maxdepth 3 -type d | sort

      # 7. Terraform Init
      - name: Terraform Init
        working-directory: terraform/phase7-hub
        run: terraform init

      # 8. Terraform Format
      - name: Terraform Format Check
        working-directory: terraform/phase7-hub
        run: terraform fmt 

      # 9. Terraform Validate
      - name: Terraform Validate
        working-directory: terraform/phase7-hub
        run: terraform validate

      # 10. Terraform Plan
      - name: Terraform Plan
        working-directory: terraform/phase7-hub
        run: terraform plan -out=tfplan

      # 11. Terraform Apply
      - name: Terraform Apply
        working-directory: terraform/phase7-hub
        run: terraform apply -auto-approve tfplan 