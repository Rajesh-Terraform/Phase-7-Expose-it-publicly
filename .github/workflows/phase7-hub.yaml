name: Phase 7 - Hub Terraform

on:
  push:
    branches:
      - main
    paths:
      - "terraform/phase7-hub/**"
      - "terraform/modules/**"
      - ".github/workflows/phase7-hub.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  hub:
    name: Phase 7 - Hub
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. AWS OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::878962827886:role/Rajesh-devops
          aws-region: ap-south-1

      # 3. Verify AWS
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 4. Verify region
      - name: Verify AWS region
        run: |
          echo "AWS Region: $AWS_REGION"

      # 5. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 6. Show repository structure
      - name: Show repository structure
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Directory structure:"
          find . -maxdepth 4 -type d | sort

          echo ""
          echo "Terraform files:"
          find ./terraform -maxdepth 4 -type f | sort

      # 7. Terraform Init
      - name: Terraform Init
        working-directory: terraform/phase7-hub
        run: terraform init

      # 8. Terraform Format
      - name: Terraform Format Check
        working-directory: terraform/phase7-hub
        run: terraform fmt -check -recursive

      # 9. Terraform Validate
      - name: Terraform Validate
        working-directory: terraform/phase7-hub
        run: terraform validate

      # 10. Terraform Plan
      - name: Terraform Plan
        working-directory: terraform/phase7-hub
        run: terraform plan -out=tfplan

      # 11. Terraform Apply
      - name: Terraform Apply
        working-directory: terraform/phase7-hub
        run: terraform apply -auto-approve tfplan  