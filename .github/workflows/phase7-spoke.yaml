name: Phase 7 - Spoke Terraform

on:
  push:
    branches:
      - main
    paths:
      - "terraform/phase7-spoke/**"
      - "terraform/modules/**"
      - ".github/workflows/phase7-spoke.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  spoke:
    name: Phase 7 - Spoke
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configure AWS OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::434097521299:role/github-actions-terraform-role-v1
          aws-region: ap-south-1

      # 3. Verify AWS account
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 4. Verify region
      - name: Verify AWS region
        run: |
          echo "AWS Region: $AWS_REGION"
          echo "AWS Default Region: $AWS_DEFAULT_REGION"

      # 5. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 6. Check repository structure
      - name: Check Terraform structure
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Terraform directories:"
          find ./terraform -maxdepth 3 -type d | sort

          echo ""
          echo "Terraform files:"
          find ./terraform -maxdepth 4 -type f | sort

      # 7. Terraform Init
      - name: Terraform Init
        working-directory: terraform/phase7-spoke
        run: terraform init

      # 8. Terraform Format
      - name: Terraform Format Check
        working-directory: terraform/phase7-spoke
        run: terraform fmt 

      # 9. Terraform Validate
      - name: Terraform Validate
        working-directory: terraform/phase7-spoke
        run: terraform validate

      # 10. Terraform Plan
      - name: Terraform Plan
        working-directory: terraform/phase7-spoke
        run: terraform plan -out=tfplan

      # 11. Terraform Apply
      - name: Terraform Apply
        working-directory: terraform/phase7-spoke
        run: terraform apply -auto-approve tfplan  