name: Phase 7 - Spoke Terraform

on:
  push:
    branches:
      - main
    paths:
      - "terraform/phase7-spoke/**"
      - "terraform/modules/**"
      - ".github/workflows/phase7-spoke.yaml"

  workflow_dispatch:

# Required for GitHub OIDC
permissions:
  id-token: write
  contents: read

jobs:
  spoke:
    name: Phase 7 - Spoke
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::434097521299:role/github-actions-terraform-role-v1
          aws-region: ap-south-1

      # 3. Verify AWS account
      - name: Verify AWS identity
        run: |
          echo "Checking AWS identity..."
          aws sts get-caller-identity

      # 4. Verify AWS region
      - name: Verify AWS region
        run: |
          echo "AWS Region:"
          aws configure get region

      # 5. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 6. Terraform Init
      - name: Terraform Init
        working-directory: terraform/phase7-spoke
        run: terraform init

      # 7. Terraform Format
      - name: Terraform Format Check
        working-directory: terraform/phase7-spoke
        run: terraform fmt 

      # 8. Terraform Validate
      - name: Terraform Validate
        working-directory: terraform/phase7-spoke
        run: terraform validate

      # 9. Terraform Plan
      - name: Terraform Plan
        working-directory: terraform/phase7-spoke
        run: terraform plan -out=tfplan

      # 10. Terraform Apply
      - name: Terraform Apply
        working-directory: terraform/phase7-spoke
        run: terraform apply -auto-approve tfplan 