name: Phase 7 - Spoke Terraform

on:
  push:
    branches:
      - main
    paths:
      - "terraform/phase7-spoke/**"
      - "terraform/modules/**"
      - ".github/workflows/phase7-spoke.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  spoke:
    name: Phase 7 - Spoke
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::434097521299:role/github-actions-terraform-role-v1
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          echo "AWS Account:"
          aws sts get-caller-identity

      - name: Verify AWS region
        run: |
          echo "AWS Region: $AWS_REGION"
          echo "AWS Default Region: $AWS_DEFAULT_REGION"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Show Terraform directory
        run: |
          echo "Current directory:"
          pwd

          echo "Terraform directories:"
          find ./terraform -maxdepth 3 -type d | sort

      - name: Terraform Init
        working-directory: terraform/phase7-spoke
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform/phase7-spoke
        run: terraform fmt 

      - name: Terraform Validate
        working-directory: terraform/phase7-spoke
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform/phase7-spoke
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/phase7-spoke
        run: terraform apply -auto-approve tfplan  