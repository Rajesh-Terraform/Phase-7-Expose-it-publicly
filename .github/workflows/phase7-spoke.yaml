
name: Phase 7 - Spoke PrivateLink

on:
  push:
    branches:
      - main
    paths:
      - "terraform/phase7-spoke/**"
      - "terraform/modules/phase7-nlb/**"
      - "terraform/modules/phase7-endpoint-service/**"
      - ".github/workflows/phase7-spoke.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  phase7-spoke:
    name: Phase 7 - Spoke PrivateLink
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------
      # 1. Checkout Repository
      # ---------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------
      # 2. Configure Spoke AWS Credentials using OIDC
      # ---------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::434097521299:role/github-actions-terraform-role-v1 
          aws-region: ap-south-1

      # ---------------------------------------------
      # 3. Verify AWS Identity
      # ---------------------------------------------
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ---------------------------------------------
      # 4. Verify AWS Region
      # ---------------------------------------------
      - name: Verify AWS Region
        run: |
          aws configure get region

      # ---------------------------------------------
      # 5. Setup Terraform
      # ---------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ---------------------------------------------
      # 6. Terraform Version
      # ---------------------------------------------
      - name: Terraform Version
        run: |
          terraform version

      # ---------------------------------------------
      # 7. Terraform Format Check
      # ---------------------------------------------
      - name: Terraform Format Check
        working-directory: terraform/phase7-spoke
        run: |
          terraform fmt -check -recursive

      # ---------------------------------------------
      # 8. Terraform Init
      # ---------------------------------------------
      - name: Terraform Init
        working-directory: terraform/phase7-spoke
        run: |
          terraform init -input=false

      # ---------------------------------------------
      # 9. Terraform Validate
      # ---------------------------------------------
      - name: Terraform Validate
        working-directory: terraform/phase7-spoke
        run: |
          terraform validate

      # ---------------------------------------------
      # 10. Terraform Plan
      # ---------------------------------------------
      - name: Terraform Plan
        working-directory: terraform/phase7-spoke
        run: |
          terraform plan \
            -input=false \
            -out=tfplan \
            -var="aws_region=ap-south-1" \
            -var="spoke_vpc_id=${{ vars.SPOKE_VPC_ID }}" \
            -var='spoke_private_subnet_ids=["${{ vars.SPOKE_PRIVATE_SUBNET_1 }}","${{ vars.SPOKE_PRIVATE_SUBNET_2 }}"]' \
            -var='app_private_ips=["${{ vars.APP_PRIVATE_IP_1 }}","${{ vars.APP_PRIVATE_IP_2 }}"]' \
            -var="hub_account_id=${{ vars.HUB_ACCOUNT_ID }}" \
            -var="app_port=80"

      # ---------------------------------------------
      # 11. Terraform Apply
      # ---------------------------------------------
      - name: Terraform Apply
        working-directory: terraform/phase7-spoke
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      # ---------------------------------------------
      # 12. Terraform Outputs
      # ---------------------------------------------
      - name: Terraform Outputs
        working-directory: terraform/phase7-spoke
        run: |
          terraform output

      # ---------------------------------------------
      # 13. Show PrivateLink Service Name
      # ---------------------------------------------
      - name: Show Endpoint Service Name
        working-directory: terraform/phase7-spoke
        run: |
          echo "=============================================="
          echo "Phase 7 Spoke PrivateLink"
          echo "=============================================="

          SERVICE_NAME=$(terraform output -raw endpoint_service_name)

          echo "Endpoint Service Name:"
          echo "$SERVICE_NAME"

          echo ""
          echo "Endpoint Service ID:"
          terraform output -raw endpoint_service_id

          echo ""
          echo "NLB DNS Name:"
          terraform output -raw nlb_dns_name   
